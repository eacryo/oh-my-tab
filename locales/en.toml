# English locale (fallback). Keys are flattened with dot separators at load time,
# e.g. [menu] toggle_theme.dark  ->  "menu.toggle_theme.dark".
# Keep keys identical across locale files; only values differ.

[menu]
toggle_theme.dark = "Switch to Dark"
toggle_theme.light = "Switch to Light"
toggle_shortcut.opt = "Switch to Opt+Tab"
toggle_shortcut.cmd = "Switch to Cmd+Tab"
settings = "Settings..."
reload_config = "Reload Config"
quit = "Quit"

[settings]
window_title = "oh-my-tab Settings"
header_appearance = "Appearance"
header_layout = "Layout"
header_keyboard = "Keyboard"
row_theme = "Theme"
row_glass_style = "Glass style"
row_glass_tint = "Glass tint (RRGGBBAA)"
row_corner_radius = "Corner radius"
row_cards_per_row = "Cards per row"
row_card_width = "Card width"
row_card_height = "Card height"
row_card_gap = "Card gap"
row_icon_size = "Icon size"
row_modifier = "Modifier key"
btn_cancel = "Cancel"
btn_ok = "OK"

[alert]
config_error_title = "Configuration Error"
save_failed_title = "Save Failed"
btn_ok = "OK"

[errors]
not_a_number = "{field}: not a number"
not_an_integer = "{field}: not an integer"
appearance_theme_invalid = 'appearance.theme: "{value}" is not one of dark, light, auto'
appearance_glass_style_invalid = 'appearance.glass_style: "{value}" is not one of regular, clear'
appearance_glass_tint_invalid = 'appearance.glass_tint: "{value}" must be 8 hex digits (RRGGBBAA)'
appearance_corner_radius_invalid = "appearance.corner_radius: {value} must be >= 0"
layout_cards_per_row_invalid = "layout.cards_per_row: {value} must be 1..=10"
layout_card_width_invalid = "layout.card_width: {value} must be >= 80"
layout_card_height_invalid = "layout.card_height: {value} must be >= 100"
layout_card_gap_invalid = "layout.card_gap: {value} must be >= 0"
layout_icon_size_invalid = "layout.icon_size: {value} must be >= 32"
colors_not_hex8 = "{field}: must be 8 hex digits"
fonts_size_invalid = "{field}: {value} must be >= 8"
fonts_weight_invalid = "{field}: {value} must be 0.0..=1.0"
keyboard_modifier_invalid = 'keyboard.modifier: "{value}" is not one of option, command'
i18n_locale_invalid = 'i18n.locale: "{value}" is not one of auto, en, zh-Hans, zh-Hant'
config_read_failed = "cannot read config: {error}"
