<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- menu bar status item 单色 template 图标:两个圆角矩形描边叠放,无背景/渐变/阴影。
       几何沿用 app icon(左上 112,112;右下 200,200;200x200;圆角 35;错开 88px);
       stroke 40,在 ~20pt 的 menu bar 尺寸下清晰。配合 NSImage setTemplate:true,
       系统按菜单栏前景色渲染。
       导出:渲染为 162x128 PNG(横向留白加宽,图形 84px 保持原始大小;代码按纵横比设 size)。
       Monochrome template icon for the menu bar status item: two stroked rounded rects overlapped,
       no background/gradient/shadow. Geometry mirrors the app icon (top-left 112,112; second
       200,200; 200x200; rx 35; offset 88px); stroke 40 for clarity at ~20pt.
       Used with NSImage setTemplate:YES so the system renders it in the menu bar foreground color.
       Export: rendered as a 162x128 PNG (wider horizontal margins, glyph kept at the original 84px;
       the code sets the size by aspect ratio). -->
  <rect x="112" y="112" width="200" height="200" rx="35" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="200" y="200" width="200" height="200" rx="35" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
